name: Dependency Submission

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  dependency-submission:
    # Fork and Dependabot PRs have read-only tokens and cannot submit snapshots.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: maven

      # The submission action invokes mvn, not ./mvnw.
      # Maven 3.10 removed the MessageUtils API used by extension 9.12.1.
      # Keep the wrapper baseline until 9.12.2 and the full build are qualified on 3.10 (TD-1).
      - name: Use Maven from wrapper
        run: |
          MVN_HOME="$(./mvnw -B -v | sed -n 's/^Maven home: //p')"
          test -x "$MVN_HOME/bin/mvn"
          echo "$MVN_HOME/bin" >> "$GITHUB_PATH"

      - name: Check Maven version
        run: mvn -v

      - name: Submit dependency graph
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
